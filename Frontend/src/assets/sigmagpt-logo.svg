<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aaaaaa;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#333" stroke-width="1"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#444" stroke-width="0.5" stroke-dasharray="4 2"/>

  <!-- Sigma symbol -->
  <text x="50" y="63"
    font-family="Georgia, serif"
    font-size="46"
    font-weight="bold"
    fill="url(#glow)"
    text-anchor="middle"
    filter="url(#blur)"
  >Σ</text>

  <!-- Top tech line -->
  <line x1="28" y1="22" x2="72" y2="22" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <!-- Bottom tech line -->
  <line x1="28" y1="78" x2="72" y2="78" stroke="#fff" stroke-width="1" opacity="0.3"/>

  <!-- Corner accents -->
  <polyline points="18,18 18,26" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="18,18 26,18" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="82,18 82,26" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="82,18 74,18" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="18,82 18,74" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="18,82 26,82" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="82,82 82,74" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="82,82 74,82" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
</svg>
